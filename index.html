<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Pro - Daily Progress & Habit Building</title>
    <meta name="description" content="A modern, high-performance web application to build positive habits, track daily streaks, and achieve your goals.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-icon">🔥</div>
                <div>
                    <h1>Habit Tracker Pro</h1>
                    <p class="subtitle">Build consistency, achieve excellence daily</p>
                </div>
            </div>
            <div class="date-badge" id="current-date-badge"></div>
        </header>

        <!-- Stats Dashboard -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <span class="stat-label">Total Habits</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <span class="stat-label">Done Today</span>
                    <span class="stat-value" id="stat-completed">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-info">
                    <span class="stat-label">Best Streak</span>
                    <span class="stat-value" id="stat-best-streak">0 days</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-info">
                    <span class="stat-label">Completion</span>
                    <span class="stat-value" id="stat-rate">0%</span>
                </div>
            </div>
        </section>

        <!-- Add Habit Form -->
        <section class="card form-card">
            <h2>Add New Habit</h2>
            <form id="add-habit-form">
                <div class="form-row">
                    <div class="input-group">
                        <input type="text" id="habit-name-input" placeholder="e.g. Morning Meditation, Read 20 pages..." required maxlength="60">
                    </div>
                    <div class="input-group category-select">
                        <select id="habit-category-select" required>
                            <option value="Health">💪 Health & Fitness</option>
                            <option value="Productivity">⚡ Productivity</option>
                            <option value="Mindset">🧠 Mindset & Learning</option>
                            <option value="Lifestyle">🌿 Lifestyle</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-add-habit">
                        <span>+ Add Habit</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">All Habits</button>
                <button class="tab-btn" data-filter="active">Active</button>
                <button class="tab-btn" data-filter="completed">Completed</button>
            </div>
            <button class="btn btn-secondary btn-sm" id="btn-reset-day">Reset Today's Checks</button>
        </div>

        <!-- Habit List -->
        <section class="habit-list-section">
            <div id="habit-list" class="habit-grid">
                <!-- Dynamic habit cards rendered here -->
            </div>
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">🌟</div>
                <h3>No habits found</h3>
                <p>Start by adding your first daily habit above to build your streak!</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
